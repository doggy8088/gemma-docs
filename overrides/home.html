{% extends "main.html" %}

{% block styles %}
{{ super() }}
<style>
  /* ===================================================================
     VIEWPORT & SCROLL LOCK  (scoped via :has(.gemma-teaser))
     =================================================================== */
  html:has(.gemma-teaser),
  body:has(.gemma-teaser),
  html:has(.gemma-teaser) .md-container,
  body:has(.gemma-teaser) .md-container,
  html:has(.gemma-teaser) .md-main,
  body:has(.gemma-teaser) .md-main {
    height: 100% !important;
    max-height: 100vh !important;
    margin: 0 !important;
    overflow: hidden !important;
    background-color: #040d1a !important;
    scrollbar-width: none !important;
  }

  html:has(.gemma-teaser) *,
  body:has(.gemma-teaser) * {
    scrollbar-width: none !important;
  }

  html:has(.gemma-teaser) *::-webkit-scrollbar,
  body:has(.gemma-teaser) *::-webkit-scrollbar,
  html:has(.gemma-teaser)::-webkit-scrollbar,
  body:has(.gemma-teaser)::-webkit-scrollbar {
    display: none !important;
    width: 0 !important;
    height: 0 !important;
  }

  /* ===================================================================
     HEADER & TABS — transparent + white text on homepage
     =================================================================== */
  html:has(.gemma-teaser) [data-md-color-scheme] .md-header,
  html:has(.gemma-teaser) [data-md-color-scheme] .md-tabs,
  body:has(.gemma-teaser) .md-header,
  body:has(.gemma-teaser) .md-tabs {
    background-color: transparent !important;
    box-shadow: none !important;
    color: #ffffff !important;
    --md-default-fg-color: hsla(230, 15%, 90%, 0.82) !important;
    --md-default-fg-color--light: hsla(230, 15%, 90%, 0.56) !important;
    --md-default-fg-color--lighter: hsla(230, 15%, 90%, 0.32) !important;
    --md-default-fg-color--lightest: hsla(230, 15%, 90%, 0.12) !important;
    --md-default-bg-color: hsla(230, 15%, 14%, 1) !important;
    --md-default-bg-color--light: hsla(230, 15%, 14%, 0.54) !important;
    --md-default-bg-color--lighter: hsla(230, 15%, 14%, 0.26) !important;
    --md-default-bg-color--lightest: hsla(230, 15%, 14%, 0.07) !important;
    --md-typeset-color: #ffffff !important;
    --md-typeset-a-color: #5488e8 !important;
    --md-primary-fg-color: #4051b5 !important;
    --md-primary-bg-color: #ffffff !important;
    --md-accent-fg-color: #4287ff !important;
    --md-search-bg-color: rgba(255, 255, 255, 0.15) !important;
    --md-search-form-bg-color: rgba(255, 255, 255, 0.15) !important;
    --md-search-form-icon-color: rgba(255, 255, 255, 0.85) !important;
    --md-search-form-input-color: #ffffff !important;
  }

  html:has(.gemma-teaser) [data-md-color-scheme] .md-header,
  body:has(.gemma-teaser) .md-header {
    border-bottom: none !important;
  }

  html:has(.gemma-teaser) [data-md-color-scheme] .md-tabs,
  body:has(.gemma-teaser) .md-tabs {
    border-bottom: 1px solid rgba(255, 255, 255, 0.08) !important;
  }

  body:has(.gemma-teaser) .md-header--shadow {
    box-shadow: none !important;
  }

  /* Hide palette toggle on homepage only (CSS hide, not DOM removal, so instant nav preserves it) */
  html:has(.gemma-teaser) [data-md-component="palette"],
  body:has(.gemma-teaser) [data-md-component="palette"] {
    display: none !important;
  }

  /* Hide footer and bottom-right 'Next' button on homepage only */
  html:has(.gemma-teaser) .md-footer,
  body:has(.gemma-teaser) .md-footer,
  html:has(.gemma-teaser) [data-md-component="footer"],
  body:has(.gemma-teaser) [data-md-component="footer"] {
    display: none !important;
  }

  html:has(.gemma-teaser) [data-md-color-scheme] .md-header__title,
  html:has(.gemma-teaser) [data-md-color-scheme] .md-header__topic,
  html:has(.gemma-teaser) [data-md-color-scheme] .md-header__button,
  html:has(.gemma-teaser) [data-md-color-scheme] .md-header__source,
  html:has(.gemma-teaser) [data-md-color-scheme] .md-tabs__link,
  body:has(.gemma-teaser) .md-header__title,
  body:has(.gemma-teaser) .md-header__topic,
  body:has(.gemma-teaser) .md-header__button,
  body:has(.gemma-teaser) .md-header__source,
  body:has(.gemma-teaser) .md-tabs__link {
    color: rgba(255, 255, 255, 0.85) !important;
  }

  html:has(.gemma-teaser) [data-md-color-scheme] .md-header__title,
  html:has(.gemma-teaser) [data-md-color-scheme] .md-tabs__link--active,
  html:has(.gemma-teaser) [data-md-color-scheme] .md-tabs__link:hover,
  html:has(.gemma-teaser) [data-md-color-scheme] .md-header__button:hover,
  body:has(.gemma-teaser) .md-header__title,
  body:has(.gemma-teaser) .md-tabs__link--active,
  body:has(.gemma-teaser) .md-tabs__link:hover,
  body:has(.gemma-teaser) .md-header__button:hover {
    color: #ffffff !important;
    opacity: 1 !important;
  }

  html:has(.gemma-teaser) [data-md-color-scheme] .md-header__button svg,
  html:has(.gemma-teaser) [data-md-color-scheme] .md-header__button .md-icon,
  html:has(.gemma-teaser) [data-md-color-scheme] .md-tabs__link svg,
  html:has(.gemma-teaser) [data-md-color-scheme] .md-tabs__link .md-icon,
  body:has(.gemma-teaser) .md-header__button svg,
  body:has(.gemma-teaser) .md-header__button .md-icon,
  body:has(.gemma-teaser) .md-tabs__link svg,
  body:has(.gemma-teaser) .md-tabs__link .md-icon {
    color: #ffffff !important;
    fill: none !important;
    stroke: currentColor !important;
  }

  /* ===================================================================
     SEARCH BAR — styled for dark homepage
     =================================================================== */
  html:has(.gemma-teaser) [data-md-color-scheme] .md-header .md-search__button,
  html:has(.gemma-teaser) [data-md-color-scheme] .md-header .md-search__form,
  body:has(.gemma-teaser) .md-header .md-search__button,
  body:has(.gemma-teaser) .md-header .md-search__form {
    background-color: rgba(255, 255, 255, 0.15) !important;
    color: rgba(255, 255, 255, 0.85) !important;
    border: 1px solid rgba(255, 255, 255, 0.2) !important;
  }

  html:has(.gemma-teaser) [data-md-color-scheme] .md-header .md-search__button:hover,
  html:has(.gemma-teaser) [data-md-color-scheme] .md-header .md-search__form:hover,
  body:has(.gemma-teaser) .md-header .md-search__button:hover,
  body:has(.gemma-teaser) .md-header .md-search__form:hover {
    background-color: rgba(255, 255, 255, 0.25) !important;
    color: #ffffff !important;
    border-color: rgba(255, 255, 255, 0.35) !important;
  }

  html:has(.gemma-teaser) [data-md-color-scheme] .md-header .md-search__input,
  body:has(.gemma-teaser) .md-header .md-search__input {
    background-color: transparent !important;
    color: #ffffff !important;
  }

  html:has(.gemma-teaser) [data-md-color-scheme] .md-header .md-search__input::placeholder,
  body:has(.gemma-teaser) .md-header .md-search__input::placeholder {
    color: rgba(255, 255, 255, 0.7) !important;
  }

  html:has(.gemma-teaser) [data-md-color-scheme] .md-header .md-search__button svg,
  html:has(.gemma-teaser) [data-md-color-scheme] .md-header .md-search__button .md-icon,
  html:has(.gemma-teaser) [data-md-color-scheme] .md-header .md-search__icon,
  html:has(.gemma-teaser) [data-md-color-scheme] .md-header .md-search__icon svg,
  html:has(.gemma-teaser) [data-md-color-scheme] .md-header .md-search__options,
  html:has(.gemma-teaser) [data-md-color-scheme] .md-header .md-search__options svg,
  body:has(.gemma-teaser) .md-header .md-search__button svg,
  body:has(.gemma-teaser) .md-header .md-search__button .md-icon,
  body:has(.gemma-teaser) .md-header .md-search__icon,
  body:has(.gemma-teaser) .md-header .md-search__icon svg,
  body:has(.gemma-teaser) .md-header .md-search__options,
  body:has(.gemma-teaser) .md-header .md-search__options svg {
    color: #ffffff !important;
    fill: none !important;
    stroke: currentColor !important;
  }

  /* ===================================================================
     BACKGROUND — subtle centered radial gradient
     =================================================================== */
  .gemma-bg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100vh;
    background: radial-gradient(circle at 50% 35%, #07152f 0%, #040c1e 55%, #020712 100%);
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
  }

  .gemma-wave-svg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  /* ===================================================================
     TEASER — centered content container
     =================================================================== */
  .gemma-teaser {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 90%;
    max-width: 960px;
    z-index: 2;
    text-align: center;
  }

  /* ===================================================================
     ANIMATED NAME — 3-column grid keeps "Gemma" pinned center
     =================================================================== */
  .gemma-name {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: baseline;
    width: 100%;
    margin: 0 auto -0.15em;
    font-size: clamp(2.4rem, 6.8vw, 6.2rem);
    font-weight: 800;
    letter-spacing: -0.03em;
    line-height: 1.15;
    color: #fff;
    user-select: none;
  }

  /* Prefix slot — right-aligned so it butts up against "Gemma" */
  .gemma-prefix-slot {
    justify-self: end;
    overflow: hidden;
    height: 1.15em;
    display: flex;
    align-items: center;
    justify-content: flex-end;
  }

  /* Suffix slot — left-aligned so it extends away from "Gemma" */
  .gemma-suffix-slot {
    justify-self: start;
    overflow: hidden;
    height: 1.15em;
    display: flex;
    align-items: center;
    justify-content: flex-start;
    white-space: pre;
  }

  /* The cycling text spans inside prefix/suffix slots — pure white */
  .gemma-cycling {
    display: inline-block;
    will-change: transform, opacity;
    color: #ffffff;
  }

  /* Static "Gemma" — always visible, rich slightly darker Gemma blue gradient */
  .gemma-static {
    background: linear-gradient(135deg, #4FA0FF 0%, #3186FF 48%, #1A4BD6 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    white-space: nowrap;
  }

  /* ===================================================================
     TAGLINE
     =================================================================== */
  .gemma-tagline {
    color: rgba(255, 255, 255, 0.65);
    font-size: clamp(1.2rem, 2.2vw, 1.65rem);
    line-height: 1.5;
    max-width: 700px;
    margin: 0 auto 2.8rem;
    font-weight: 400;
    letter-spacing: 0.01em;
  }

  /* ===================================================================
     CTA BUTTON
     =================================================================== */
  .gemma-actions {
    display: flex;
    justify-content: center;
  }

  .gemma-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 0.95rem 2.8rem;
    font-size: 1.22rem;
    font-weight: 700;
    border-radius: 8px;
    text-decoration: none !important;
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    background-color: #3186FF;
    color: #ffffff !important;
    border: 1px solid rgba(255, 255, 255, 0.15);
    box-shadow: 0 6px 24px rgba(49, 134, 255, 0.4);
  }

  .gemma-btn:hover {
    background-color: #2563eb;
    border-color: #ffffff;
    transform: translateY(-2px);
    box-shadow: 0 8px 32px rgba(49, 134, 255, 0.6);
  }

  /* ===================================================================
     RESPONSIVE (Prevents mobile cutoff for long names like DiffusionGemma)
     =================================================================== */
  @media (max-width: 768px) {
    .gemma-name {
      font-size: clamp(1.8rem, 6vw, 2.6rem);
    }

    .gemma-tagline {
      font-size: 1.25rem;
      margin-bottom: 2.2rem;
    }

    .gemma-btn {
      padding: 0.85rem 2.4rem;
      font-size: 1.12rem;
    }
  }

  @media (max-width: 500px) {
    .gemma-name {
      font-size: clamp(1.35rem, 6.2vw, 1.75rem);
    }

    .gemma-tagline {
      font-size: 1.05rem;
    }
  }
</style>
{% endblock %}

{% block container %}
<div class="gemma-bg">
  <svg class="gemma-wave-svg" viewBox="0 0 1440 900" fill="none" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
    <defs>
      <linearGradient id="gemmaWaveGrad1" x1="0%" y1="0%" x2="100%" y2="50%">
        <stop offset="0%" stop-color="#3186FF" stop-opacity="0.55" />
        <stop offset="50%" stop-color="#4FA0FF" stop-opacity="0.75" />
        <stop offset="100%" stop-color="#346BF1" stop-opacity="0.15" />
      </linearGradient>
      <linearGradient id="gemmaWaveGrad2" x1="100%" y1="100%" x2="0%" y2="0%">
        <stop offset="0%" stop-color="#64B5F6" stop-opacity="0.5" />
        <stop offset="50%" stop-color="#3186FF" stop-opacity="0.65" />
        <stop offset="100%" stop-color="#0e244b" stop-opacity="0.2" />
      </linearGradient>
      <linearGradient id="gemmaCoreGlow" x1="0%" y1="50%" x2="100%" y2="50%">
        <stop offset="0%" stop-color="#3186FF" stop-opacity="0.0" />
        <stop offset="45%" stop-color="#4FA0FF" stop-opacity="0.45" />
        <stop offset="55%" stop-color="#64B5F6" stop-opacity="0.6" />
        <stop offset="100%" stop-color="#346BF1" stop-opacity="0.0" />
      </linearGradient>
      <filter id="waveBlurLow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="6" />
      </filter>
      <filter id="waveBlurHigh" x="-30%" y="-30%" width="160%" height="160%">
        <feGaussianBlur stdDeviation="24" />
      </filter>
      <filter id="coreBloom" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="45" />
      </filter>
    </defs>

    <!-- Deep luminous background bloom positioned lower beneath the text baseline -->
    <ellipse cx="720" cy="650" rx="660" ry="150" fill="url(#gemmaCoreGlow)" filter="url(#coreBloom)" opacity="0.75" />
    <ellipse cx="680" cy="670" rx="380" ry="85" fill="#1D53D4" filter="url(#coreBloom)" opacity="0.25" />

    <!-- Layer 1: Wide diffuse underlying wave ribbon (High Blur, lowered Y coordinates) -->
    <path d="M-100 690 C 300 500, 520 790, 850 580 C 1120 420, 1350 650, 1580 550 L 1580 950 L -100 950 Z" fill="url(#gemmaWaveGrad1)" filter="url(#waveBlurHigh)" opacity="0.45" />

    <!-- Layer 2: Mid-layer flowing wave (Low Blur for ethereal softness) -->
    <path d="M-100 660 C 250 460, 480 730, 780 570 C 1080 400, 1320 620, 1580 520 L 1580 950 L -100 950 Z" fill="url(#gemmaWaveGrad2)" filter="url(#waveBlurLow)" opacity="0.55" />

    <!-- Layer 3: Sharp glowing crest arcs representing the flowing energy stream -->
    <path d="M-100 660 C 250 460, 480 730, 780 570 C 1080 400, 1320 620, 1580 520" stroke="#64B5F6" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.75" filter="url(#waveBlurLow)" />
    <path d="M-100 660 C 250 460, 480 730, 780 570 C 1080 400, 1320 620, 1580 520" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.65" />
    
    <!-- Secondary intersecting glowing strand -->
    <path d="M-100 720 C 220 640, 490 500, 760 600 C 1030 700, 1280 490, 1580 590" stroke="#4FA0FF" stroke-width="2.5" fill="none" opacity="0.6" filter="url(#waveBlurLow)" />
    <path d="M-100 720 C 220 640, 490 500, 760 600 C 1030 700, 1280 490, 1580 590" stroke="#90CAF9" stroke-width="1" fill="none" opacity="0.5" />

    <!-- Third dynamic flowing arc -->
    <path d="M-50 570 C 350 680, 600 470, 900 640 C 1180 800, 1380 560, 1600 660" stroke="#3186FF" stroke-width="2" fill="none" opacity="0.45" filter="url(#waveBlurLow)" />
  </svg>
</div>

<div class="gemma-teaser">
  <div class="gemma-name" aria-label="Gemma model family">
    <div class="gemma-prefix-slot">
      <span class="gemma-cycling" id="gemma-prefix"></span>
    </div>
    <span class="gemma-static">Gemma</span>
    <div class="gemma-suffix-slot">
      <span class="gemma-cycling" id="gemma-suffix"></span>
    </div>
  </div>

  <p class="gemma-tagline">
    Our most capable open models
  </p>

  <div class="gemma-actions">
    <a class="gemma-btn" href="get-started/quickstart/">
      Get Started
    </a>
  </div>
</div>

<script>
  (function () {
    var variants = [
      { prefix: '', suffix: '\u00a04' },
      { prefix: 'Pali', suffix: '' },
      { prefix: '', suffix: '\u00a03n' },
      { prefix: 'Diffusion', suffix: '' },
      { prefix: '', suffix: '\u00a03' },
      { prefix: 'Code', suffix: '' },
      { prefix: 'Shield', suffix: '' },
      { prefix: 'Embedding', suffix: '' },
      { prefix: '', suffix: '\u00a02' },
      { prefix: 'Function', suffix: '' },
      { prefix: 'Data', suffix: '' },
      { prefix: 'Recurrent', suffix: '' },
    ];

    var index = 0;
    var prefixEl = document.getElementById('gemma-prefix');
    var suffixEl = document.getElementById('gemma-suffix');

    if (!prefixEl || !suffixEl) return;

    // Show first variant immediately
    prefixEl.textContent = variants[0].prefix;
    suffixEl.textContent = variants[0].suffix;
    prefixEl.style.transform = 'translateY(0)';
    prefixEl.style.opacity = '1';
    suffixEl.style.transform = 'translateY(0)';
    suffixEl.style.opacity = '1';

    var DURATION = 3000;      // ms between cycles
    var ANIM = 400;       // ms for slide transition
    var EASE = 'cubic-bezier(0.4, 0, 0.2, 1)';

    var intervalId = setInterval(function () {
      // Bail out if we've navigated away (instant navigation)
      if (!document.body.contains(prefixEl)) {
        clearInterval(intervalId);
        return;
      }

      // --- EXIT: slide current text up and fade out ---
      prefixEl.style.transition = 'transform ' + ANIM + 'ms ' + EASE + ', opacity ' + ANIM + 'ms ease';
      suffixEl.style.transition = 'transform ' + ANIM + 'ms ' + EASE + ', opacity ' + ANIM + 'ms ease';
      prefixEl.style.transform = 'translateY(-120%)';
      prefixEl.style.opacity = '0';
      suffixEl.style.transform = 'translateY(-120%)';
      suffixEl.style.opacity = '0';

      setTimeout(function () {
        // Advance to next variant
        index = (index + 1) % variants.length;
        var v = variants[index];

        // Swap text content
        prefixEl.textContent = v.prefix;
        suffixEl.textContent = v.suffix;

        // --- PRE-ENTER: position below, no transition ---
        prefixEl.style.transition = 'none';
        suffixEl.style.transition = 'none';
        prefixEl.style.transform = 'translateY(120%)';
        prefixEl.style.opacity = '0';
        suffixEl.style.transform = 'translateY(120%)';
        suffixEl.style.opacity = '0';

        // Force reflow so the browser registers the position reset
        void prefixEl.offsetHeight;

        // --- ENTER: slide up into view ---
        requestAnimationFrame(function () {
          prefixEl.style.transition = 'transform ' + ANIM + 'ms ' + EASE + ', opacity ' + ANIM + 'ms ease';
          suffixEl.style.transition = 'transform ' + ANIM + 'ms ' + EASE + ', opacity ' + ANIM + 'ms ease';
          prefixEl.style.transform = 'translateY(0)';
          prefixEl.style.opacity = '1';
          suffixEl.style.transform = 'translateY(0)';
          suffixEl.style.opacity = '1';
        });
      }, ANIM + 30);
    }, DURATION);
  })();
</script>
{% endblock %}
