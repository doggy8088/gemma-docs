name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: these jobs only read the repo.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs (org policy: zizmor unpinned-uses).
      # Update a pin by resolving the tag, e.g.:
      #   gh api repos/actions/checkout/git/ref/tags/v4 --jq '.object.sha'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      # Both scripts are stdlib-only (tomllib requires 3.11+), so there is nothing to install.
      - name: Converter golden tests
        run: python scripts/test_convert_notebook.py

      - name: Lint documentation
        run: python scripts/lint_docs.py --baseline

      # Advisory: shows the full Phase 0 backlog without affecting the job result.
      - name: Backlog (informational)
        if: always()
        run: python scripts/lint_docs.py || true
