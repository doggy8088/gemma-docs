name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: these jobs only read the repo.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs (org policy: zizmor unpinned-uses).
      # Update a pin by resolving the tag, e.g.:
      #   gh api repos/actions/checkout/git/ref/tags/v7 --jq '.object.sha'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      # The generators use Jinja for raw Markdown and PyYAML for structured frontmatter.
      - name: Install linter dependencies
        run: pip install pyyaml==6.0.3 jinja2==3.1.6

      - name: Script tests
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Lint documentation
        run: python scripts/lint_docs.py --baseline

      # Advisory: shows the full Phase 0 backlog without affecting the job result.
      - name: Backlog (informational)
        if: always()
        run: python scripts/lint_docs.py || true
