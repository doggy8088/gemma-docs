name: Deploy Gemma Docs

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Least privilege at the workflow level; the deploy job widens this for itself.
# Granting pages/id-token here would hand them to the build job too, which only needs to read.
permissions:
  contents: read

# Only allow one deployment at a time
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs (org policy: zizmor unpinned-uses).
      # Update a pin by resolving the tag, e.g.:
      #   gh api repos/actions/checkout/git/ref/tags/v4 --jq '.object.sha'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6

      - name: Build docs
        run: |
          uv run \
            --with zensical \
            --index-url https://pypi.zensical.org/simple/ \
            --extra-index-url https://pypi.org/simple/ \
            zensical build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Scoped to this job only -- these are what actions/deploy-pages needs.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
