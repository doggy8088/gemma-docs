# ============================================================================
# Zensical Configuration for Google DeepMind Gemma Documentation
# ============================================================================

[project]

site_name = "Gemma 文件"
site_description = "Google DeepMind Gemma 開放模型繁體中文文件"
site_author = "Google DeepMind"
site_url = "https://gemma.gh.miniasp.com"

copyright = """
Copyright &copy; 2026 Google DeepMind
"""
# Order matters: the token layer must load first, motion last.
extra_css = [
  "stylesheets/gemma.css",       # tokens: palette, spacing, radius, shadow
  "stylesheets/layout.css",      # page grid, sidebars, typography scale
  "stylesheets/nav.css",         # header, tabs, sidebar, table of contents
  "stylesheets/content.css",     # tables, admonitions, code, tabs
  "stylesheets/components.css",  # cards, badges, figures, steps, embeds
  "stylesheets/icons.css",       # inlined icon-set SVGs and card icons
  "stylesheets/engine-grid.css", # quickstart: the "run it with" engine grid
  "stylesheets/model-tree.css",  # models overview: the family lineage tree
  "stylesheets/embeds.css",      # external interactive demos
  "stylesheets/page-context.css",# the applicability bar above every H1
  "stylesheets/tokens.css",      # chat-token badges
  "stylesheets/home.css",        # landing page: chrome, backdrop, hero
  "stylesheets/motion.css",      # transitions + reduced-motion opt-out
]
# Order matters: the generated data must load before the switcher that reads it.
extra_javascript = [
  "javascripts/model-data.js",     # GENERATED from data/models.yml -- do not edit
  "javascripts/model-switcher.js", # page context strip selector + code rewriting
  "javascripts/mathjax.js",
  "https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js",
]
# `include_yaml` exposes data/models.yml as `modeldata.*` in page templates. NOT `models.*`:
# every page carries a `models:` frontmatter key, and page metadata shadows a macros variable
# of the same name -- which silently broke both generated tables. See data/models.yml
# for what reads it. Hand-editing a model table in a page is a bug; change the data file.
plugins = { macros = { enabled = true, include_yaml = { modeldata = "data/models.yml", frameworkdata = "data/frameworks.yml" } } }

